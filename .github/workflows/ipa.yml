name: Build IPA

# Builds an UNSIGNED LiftBros.ipa for real iPhones (arm64, Release).
# Install it with a sideloading tool such as Sideloadly or AltStore, which signs it
# with your own Apple ID during install. See README → "Install on your iPhone".

on:
  workflow_dispatch:
  push:
    paths:
      - "LiftBros/**"
      - "LiftBros.xcodeproj/**"
      - ".github/workflows/ipa.yml"

permissions:
  contents: write

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode_16.app || true
      - name: Build for iPhone (Release, unsigned)
        run: |
          xcodebuild build \
            -project LiftBros.xcodeproj -scheme LiftBros -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/ipa \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -quiet
      - name: Package IPA
        run: |
          rm -rf Payload dist && mkdir -p Payload dist
          cp -R build/ipa/Build/Products/Release-iphoneos/LiftBros.app Payload/
          zip -qry dist/LiftBros-unsigned.ipa Payload
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: LiftBros-unsigned-ipa
          path: dist/LiftBros-unsigned.ipa
      - name: Commit IPA to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/LiftBros-unsigned.ipa
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Build unsigned LiftBros.ipa [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done
